#!/usr/bin/env python3
PACKAGE = 'abc_swarm'
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()
gen.add('k_distance', double_t, 0, 'Position approach proportional gain', 0.9, 0.05, 3.0)
gen.add('k_heading', double_t, 0, 'Bearing and final yaw proportional gain', 2.0, 0.1, 6.0)
exit(gen.generate(PACKAGE, 'abc_swarm', 'point_control'))
