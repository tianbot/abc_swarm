# Shared startup stage settings; lengths in metres and times in seconds.
# Final position/yaw accuracy belongs to control_config, not handoff_distance.
handoff_distance: 0.15
clearance: 0.02
position_margin: 0.005
handoff_time: 0.3
settle_time: 0.5
progress_timeout: 45.0
stop_linear: 0.02
stop_angular: 0.05
waypoint_tolerance: 0.025
