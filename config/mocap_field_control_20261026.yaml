# Explicit current-field profile; load with control_config, never applied globally.
# Mini 02 offset fitted from zero-linear-command rotation on 2026-10-26:
# marker radius 0.03358 m; XY residual RMS 0.00066 m over ~72 deg.
# This estimates the planar rotation center, not the vehicle forward yaw offset.
# 01/03 remain identity transforms, NOT newly calibrated axle poses.
target_reference: initial_leader
target_poses:
  - [0.0, 0.0, 0.0]
  - [-0.5, 0.5, 0.0]
  - [-0.5, -0.5, 0.0]
fixed_frame: world
tf_timeout: 0.5
max_linear: 0.15
max_angular: 0.5
position_tolerance: 0.04
yaw_tolerance: 0.08
k_distance: 0.9
k_heading: 2.0
stationary_hold:
  settle_time: 0.4
  linear_threshold: 0.01
  angular_threshold: 0.05
mocap_calibration:
  tianbot_mini_01:
    yaw_offset: 0.0
    marker_offset: [0.0, 0.0]
  tianbot_mini_02:
    yaw_offset: 0.0
    marker_offset: [0.033511768984840616, 0.0020928827817474627]
  tianbot_mini_03:
    yaw_offset: 0.0
    marker_offset: [0.0, 0.0]
